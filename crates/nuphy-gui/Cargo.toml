[package]
name = "nuphy-gui"
description = "Desktop key remapper for NuPhy keyboards"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nuphy-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
nuphy-proto = { path = "../nuphy-proto" }
nuphy-hid = { path = "../nuphy-hid" }
nuphy-core = { path = "../nuphy-core" }
