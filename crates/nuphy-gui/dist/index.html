<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NuPhy Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand-name" data-i18n="app.title">NuPhy Desktop</span>
    <span id="device" class="device"></span>
  </div>
  <div class="tools">
    <label class="pill-select dark" id="mode-wrap" hidden>
      <span class="sr-only" data-i18n="mode.label"></span>
      <select id="mode-select"></select>
    </label>
    <label class="pill-select">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.9A8 8 0 0 1 18.9 8ZM12 4c.8 1.1 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.9 1.9-4ZM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h3a15.7 15.7 0 0 0 1.4 3.9A8 8 0 0 1 5.1 16Zm3-8h-3a8 8 0 0 1 4.4-3.9C8.9 5.3 8.4 6.6 8.1 8ZM12 20c-.8-1.1-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.9-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.9c.6-1.2 1.1-2.5 1.4-3.9h3a8 8 0 0 1-4.4 3.9Zm1.7-5.9a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4Z"/></svg>
      <span class="sr-only" data-i18n="lang.label"></span>
      <select id="lang-select"></select>
    </label>
    <button id="btn-backups" class="icon-btn" data-i18n-title="backups.open">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9.1.1L9 12H6a7 7 0 1 1 2.1 5L6.7 18.4A9 9 0 1 0 13 3Zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8H12Z"/></svg>
    </button>
    <button id="btn-refresh" class="icon-btn" data-i18n-title="conn.refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 19.7 14h-2.1a6 6 0 1 1-1.4-6.2L13 11h7V4l-2.3 2.3Z"/></svg>
    </button>
  </div>
</header>

<main id="main"></main>

<aside id="backups" class="drawer" hidden>
  <div class="drawer-head">
    <h2 data-i18n="backups.title"></h2>
    <button id="btn-backups-close" class="icon-btn" data-i18n-title="common.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
    </button>
  </div>
  <p class="muted" data-i18n="backups.hint"></p>
  <button id="btn-make-backup" class="btn dark" data-i18n="backups.make"></button>
  <ul id="backup-list" class="backup-list"></ul>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="layouts.js"></script>
<script src="keys.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
