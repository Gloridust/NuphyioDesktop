name: Release

# Push a tag like v0.1.0 to build the Linux packages and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Built on the oldest supported Ubuntu so the packages run on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version in the sources
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tauri_ver=$(jq -r .version crates/nuphy-gui/tauri.conf.json)
          echo "tag=$tag Cargo.toml=$cargo_ver tauri.conf.json=$tauri_ver"
          [ "$tag" = "$cargo_ver" ] && [ "$tag" = "$tauri_ver" ] || { echo "::error::tag and source versions differ"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev file xdg-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace

      - name: Build the desktop app (.deb and .AppImage)
        working-directory: crates/nuphy-gui
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build

      - name: Build the command line tool
        run: cargo build --release -p nuphy-cli

      - name: Collect release files
        run: |
          v=${{ steps.ver.outputs.version }}
          mkdir -p out
          cp target/release/bundle/deb/nuphy-desktop_${v}_amd64.deb out/
          cp target/release/bundle/appimage/nuphy-desktop_${v}_amd64.AppImage out/
          d=nuphy-cli-${v}-x86_64-linux
          mkdir -p "$d"
          cp target/release/nuphy contrib/udev/70-nuphy.rules LICENSE README.md "$d"/
          tar -czf out/"$d".tar.gz "$d"
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "NuPhy Desktop ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
