[workspace]
resolver = "2"
members = ["crates/nuphy-proto", "crates/nuphy-hid", "crates/nuphy-core", "crates/nuphy-cli", "crates/nuphy-gui"]
# The GUI pulls in Tauri; build it explicitly with `-p nuphy-gui`.
default-members = ["crates/nuphy-proto", "crates/nuphy-hid", "crates/nuphy-core", "crates/nuphy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Gloridust/NuphyioDesktop"
